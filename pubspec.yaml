name: kids_learn
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Ses paketimizi geri ekledik
  audioplayers: ^6.0.0
  shared_preferences: ^2.5.4
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Klasör yollarımızı geri ekledik (Girintilere dikkat!)
  assets:
    - assets/audio/
    - assets/audio/numbers/
    - assets/images/
    - assets/images/numbers/
    - assets/images/mascot/
    - assets/images/animals/
    - assets/audio/animals/
    - assets/images/colors/
    - assets/audio/colors/
    - assets/images/shapes/
    - assets/audio/shapes/
    - assets/images/body_parts/
    - assets/audio/body_parts/
    - assets/images/fruits_vegetables/
    - assets/audio/fruits_vegetables/
    - assets/images/vehicles/
    - assets/audio/vehicles/
    - assets/images/clothes/
    - assets/audio/clothes/
    - assets/images/emotions/
    - assets/audio/emotions/